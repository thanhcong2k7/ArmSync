
name: Build ArmSync Windows x86

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Windows 32-bit
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP "vcpkg"

          git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkg

          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics

          "VCPKG_ROOT=$vcpkg" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install x86 dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            "libssh2[openssl]:x86-windows" `
            "openssl:x86-windows"

      - name: Configure CMake
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_ROOT `
            "scripts\buildsystems\vcpkg.cmake"

          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A Win32 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x86-windows `
            -DARMSYNC_FETCH_WX=ON

      - name: Build ArmSync
        run: cmake --build build --config Release --parallel 2

      - name: Package Windows x86
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          Copy-Item "build\Release\ArmSync.exe" dist\

          # Include runtime DLL dependencies from vcpkg.
          $runtime = Join-Path $env:VCPKG_ROOT `
            "installed\x86-windows\bin"

          Get-ChildItem "$runtime\*.dll" |
            Copy-Item -Destination dist\ -Force

          # Verify that the executable is actually x86.
          $bytes = [IO.File]::ReadAllBytes("$PWD\dist\ArmSync.exe")
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)

          if ($machine -ne 0x14C) {
            throw "ArmSync.exe is not a 32-bit x86 executable!"
          }

          Compress-Archive -Path dist\* `
            -DestinationPath ArmSync-windows-x86.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmSync-windows-x86
          path: ArmSync-windows-x86.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ArmSync-windows-x86.zip
